aid: photocert
name: Photocert
description: Photocert is a London-based visual AI company (a Techstars portfolio company) that
  authenticates photos and videos at the point of capture to prevent fraud, waste, and abuse across
  insurance and enterprise visual-inspection workflows. Its platform detects AI-generated images and
  deepfakes at scale, certifies media with claimed 99.99% accuracy, and automates motor, content, and
  property (water-leak) insurance claims. Photocert markets REST APIs and SDKs plus a white-label
  claim/onboarding platform and a camera API component for image certification, though no public
  developer documentation, OpenAPI, or self-service portal is published — integration is arranged via
  sales/demo. This profile was added to the API Evangelist network from the Techstars portfolio and
  enriched with the honest public surface.
